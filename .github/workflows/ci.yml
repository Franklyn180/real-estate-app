name: Real Estate App CI

on:
  push:
    branches: 
      - main
      - develop

  pull_request:
    branches:
      - main
jobs:
  Application-tests:
    runs-on: self-hosted

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/real-estate-backend:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/real-estate-frontend:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend Lint
        working-directory: backend
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run security dependencies audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run sonarqube analysis
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build

      - name: Login to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Images to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
