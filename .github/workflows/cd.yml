name: Real Estate App CD
on:
  workflow_run:
    workflows: ["Real Estate App CI"]
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' 

    runs-on: self-hosted
    
    steps: 
      - name: Confirm CI workflow run was successful
        run: |
          echo "CI workflow run was successful."
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"



