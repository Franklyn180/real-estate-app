name: Real Estate App CD
on:
  workflow_run:
    workflows: ["Real Estate App CI"]
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' 

    runs-on: self-hosted

    env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    
    steps: 
      - name: Confirm CI workflow run was successful
        run: |
          echo "CI workflow run was successful."
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"

        
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Backend Image
        run: |
          docker pull "$DOCKERHUB_USERNAME/real-estate-backend:$IMAGE_TAG"

      - name: Pull Frontend Image
        run: |
          docker pull "$DOCKERHUB_USERNAME/real-estate-frontend:$IMAGE_TAG"

            





